# Сборка на push, публикация на GitHub Pages. Хостинг остаётся прежним —
# меняется только то, что Pages отдаёт собранный dist, а не сырой index.html.
name: build-and-deploy
on:
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run lint      # ловит необъявленные переменные до прода
      - run: npm test          # тесты обязаны пройти, иначе выката нет
      - run: npm run build
      # Смоук-стенд выполняет СОБРАННЫЙ бандл с заглушками браузерных API.
      # До правки он искал только инлайн-скрипты и после перехода на Vite
      # не находил ничего — то есть годами горел зелёным вхолостую.
      - run: node tests/smoke.cjs dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
