name: visual-qa
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  design-review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Capture complete workspaces for design review
        run: npx playwright test tests/visual/workspace-review.spec.mjs --project=mobile-390-light --project=desktop-1440-light --retries=0 --timeout=15000
      - name: Keep workspace comparison screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-review-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
  operations-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Check operational screens and windows before the full matrix
        run: >-
          npx playwright test tests/visual/application.spec.mjs
          tests/visual/windows.spec.mjs tests/visual/layout-filter-regressions.spec.mjs
          tests/visual/unassigned-tracks.spec.mjs
          --project=mobile-360-light --project=mobile-390-dark --project=desktop-1440-light
          --grep='logist (notifications|dispatcher$|task-active|trip$|map$|catalog$)|vehicle summary|client popup|timeline primary|route panel|dispatcher actions|trips actions|journal period'
      - name: Keep focused screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-smoke-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
  chromium:
    runs-on: ubuntu-latest
    # Run every viewport and theme without one long job exhausting its time limit.
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile-360, mobile-390, tablet-768, desktop-1024, desktop-1440]
    name: chromium (${{ matrix.viewport }})
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run qa:visual -- --project=${{ matrix.viewport }}-light --project=${{ matrix.viewport }}-dark
      - name: Keep screenshots, measurements, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ matrix.viewport }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
